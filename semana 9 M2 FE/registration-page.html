<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="icon" href="imgs/8019152-removebg-preview.png" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="global-div">
      <div id="body-div">
        <img src="imgs/8019152-removebg-preview.png" class="images" />
        <h2 class="text">Registration Form</h2>
        <input
          type="text"
          class="input-text"
          id="name-registration"
          placeholder="Please enter your username"
        />
        <input
          class="input-text"
          type="password"
          name="password"
          id="password-id"
          placeholder="Please enter your password"
        />
        <input
          class="input-text"
          type="password"
          name="password"
          id="password-confirm"
          placeholder="Please confirm  your password"
        />
        <button type="button" id="registation-button" class="buttons">
          Create user
        </button>
        <a href="login-page.html" class="links"> Already an User?</a>
      </div>
    </div>
  </body>
  <script src="scripts/registrationScript.js"></script>
</html>
